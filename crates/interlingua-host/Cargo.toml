# The plugin as a library for the desktop emulator (`code-host.dylib`,
# `.so` or `.dll`), which loads it as Android loads `code.so`. The devices
# take the file `src/main.rs` makes instead. See docs/plugins.md, "The file
# in the emulator".
[package]
name = "interlingua-host"
description = "Interlingua as a library for the desktop emulator"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Outline fonts for the emulator's build only: the X4s draw font packs.
paperpaw-sdk = { version = "0.5.0-beta.9", features = ["outline"] }
interlingua = { path = "../interlingua" }
