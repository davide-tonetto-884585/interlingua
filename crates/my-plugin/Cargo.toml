[package]
name = "my-plugin"
description = "A PaperPaw plugin to start from: an action, a screen, a setting and an event"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
paperpaw-sdk = "0.5.0-beta.6"

[dev-dependencies]
# Not on crates.io: it brings the emulator and the whole standard app.
# Examples and tests may use it, the plugin itself never sees it.
paperpaw-dev = { git = "https://github.com/hthoene/paperpaw", tag = "v0.5.0-beta.6" }
