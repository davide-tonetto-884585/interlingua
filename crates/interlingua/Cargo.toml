[package]
name = "interlingua"
description = "A PaperPaw plugin for bilingual reading: a translation above each line of a book, or after each paragraph"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
paperpaw-sdk = "0.5.0-beta.9"

# Not on the reader: only examples and tests use these. Keep their tag the
# same as the patch of paperpaw-sdk in the root Cargo.toml.
[dev-dependencies]
# The emulator and the whole standard app, for `paperpaw-dev check`.
paperpaw-dev = { git = "https://github.com/hthoene/paperpaw", tag = "v0.5.0-beta.9" }
# The kernel and the standard app, for tests/interlingua.rs.
paperpaw-app = { git = "https://github.com/hthoene/paperpaw", tag = "v0.5.0-beta.9" }
paperpaw-core = { git = "https://github.com/hthoene/paperpaw", tag = "v0.5.0-beta.9" }
paperpaw-platform = { git = "https://github.com/hthoene/paperpaw", tag = "v0.5.0-beta.9" }
