# The crate that makes the plugin file for the readers (`code.ppn`): one
# line of code, `plugin!` around the plugin. The plugin itself is
# crates/interlingua, a crate of its own that is tested on a computer and
# tried in the emulator. The layout of PaperPaw's samples/hello-native.
[package]
name = "interlingua-native"
description = "Interlingua as a native plugin file for the Xteink X4 and X4 Pro"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# A workspace of its own, as a plugin's own repository is: the file it
# makes must fit firmware built elsewhere.
[workspace]
members = ["crates/interlingua", "crates/interlingua-host"]

[[bin]]
name = "interlingua"
path = "src/main.rs"
test = false
bench = false

[dependencies]
# The PaperPaw release the plugin is built for (plugin interface 4). Move
# these together to a new release: this line, the patch below, the three
# git tags in crates/interlingua/Cargo.toml, rust-toolchain.toml and
# PAPERPAW (with its compilers) in .github/workflows/paperpaw-release.yml.
paperpaw-sdk = "0.5.0-beta.9"
interlingua = { path = "crates/interlingua" }

# One SDK for the plugin and for the app of paperpaw-dev and the tests:
# see tools/dev/templates/README.md in PaperPaw's repository.
[patch.crates-io]
paperpaw-sdk = { git = "https://github.com/hthoene/paperpaw", tag = "v0.5.0-beta.9" }

# As the firmware is built: small code, one unit, no unwinding.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
# Lines in the ELF, for naming the functions of a crash's calls.
debug = "line-tables-only"
