# What the plugin store shows of the plugin (https://paperpaw.org/authors#store-ini).
# Only the store reads store/; it is taken out of what readers install.
# Every key is optional: the form asks for what is missing.
# Comments go on lines of their own, never after a value.

[store]
# One sentence, at most 160 characters.
summary = A translation above each line of a book, or after each paragraph, for reading in two languages.
# At most 2000 characters, one line (in quotes, \n for a new line).
description = "Interlingua shows a small translation above each line of a book, starting where each sentence begins, and opens it whole on a tap. It can also add a translated paragraph after each paragraph.\n\nThe text of each paragraph is sent to the service you choose, Google or DeepL, with your own key, kept with your passwords and keys. Nothing is sent until you ask for a chapter to be translated. Translations are kept on the card."
# One of: reading, formats, library, sync, home, look, notes, learning,
# news, tools, games, system.
group = learning
# At most five, separated by commas.
tags = interlinear, translation, bilingual, languages
# An SPDX identifier.
licence = Apache-2.0
# Where the source lives, an https address.
source = https://github.com/davide-tonetto-884585/interlingua
# The PaperPaw SDK it is built against.
sdk = 0.5

[source]
# The exact source of the builds: a public repository on github.com,
# codeberg.org or gitlab.com, and the tag (or 40-digit commit) built.
repository = https://github.com/davide-tonetto-884585/interlingua
revision = v0.1.1
# The package of the root crate is interlingua-native, its binary interlingua.
bin = interlingua

[i18n.it]
name = Interlingua
summary = Una traduzione sopra ogni riga di un libro, o dopo ogni paragrafo, per leggere in due lingue.

[i18n.de]
name = Interlingua
summary = Eine Übersetzung über jeder Zeile eines Buches oder nach jedem Absatz, zum Lesen in zwei Sprachen.

[screenshots]
translated-page.png = A page with the translation above each line, on an Xteink X4.
